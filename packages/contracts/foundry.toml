[profile.default]
src = "src"
out = "out"
libs = ["lib"]

[fuzz]
runs = 512

[invariant]
runs = 256
# The handler try/catches every revert it deliberately provokes (mismatched
# merchants, replayed nonces, over-withdrawals), so a top-level revert out of
# the handler is never expected. Failing loudly on one converts a future
# silent ghost-accounting panic (see EscrowHandler.settle/withdraw) from a
# discarded call -- invisible across all 128,000 calls in a run -- into an
# immediate, loud test failure.
fail_on_revert = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
